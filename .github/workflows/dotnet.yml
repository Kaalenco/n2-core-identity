# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and test

on:
  push:
    branches: [ "trunk" ]
    paths:
      - 'src/N2.*/**'
  pull_request:
    branches: [ "trunk" ]
    paths:
      - 'src/N2.*/**'

jobs:
  # For the checkout and upload artifacts, we use the latest versions of the actions as of March 2026.
  # For the .NET setup, we use v4 which supports both .NET 8 and 10.
  # Before update, use gh (github cli) to check for the latest versions of these actions:
  # gh release list --repo actions/checkout --limit 5
  # gh release list --repo actions/upload-artifact --limit 5
  # Always check for compatibility issues when updating action versions, especially for major version changes.

  # ── Build and Unit Tests ───────────────────────────────────────────────────────
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: Firenza/secrets-to-env@v1.3.0
      name: Set secrets as environment variables
      with:
        secrets: ${{ toJSON(secrets) }}
        secret_filter_regex: ENV_*
    - uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src
    - name: Build
      run: dotnet build src --no-restore
    - name: Test
      env:
        # Limit test output logs to show only errors
        Logging__LogLevel__Default: Error
      run: dotnet test src --no-build --verbosity normal --filter "TestCategory!=Integration" --logger trx --results-directory src/TestResults

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: src/TestResults/*.trx

  # ── Code Analysis (Coverage + Complexity) ─────────────────────────────────
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build
      run: dotnet build src --no-restore

    - name: Run unit tests with coverage
      env:
        Logging__LogLevel__Default: Error
      run: |
        dotnet test src/N2.Core.Identity.UnitTests \
          --no-build \
          --framework net8.0 \
          --verbosity normal \
          --filter "TestCategory!=Integration" \
          --collect:"XPlat Code Coverage" \
          --results-directory src/TestResults/Coverage

    - name: Install ReportGenerator
      run: dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate coverage report
      run: |
        reportgenerator \
          -reports:"src/TestResults/Coverage/**/coverage.cobertura.xml" \
          -targetdir:"reports/coverage" \
          -reporttypes:"Html;HtmlSummary" \
          -assemblyfilters:"+N2.Core.Identity" \
          -title:"N2.Core.Identity — Test Coverage"

    - name: Install lizard
      run: pip install lizard

    - name: Generate complexity report
      run: |
        mkdir -p reports/complexity
        lizard src/N2.Core.Identity -C 10 --html > reports/complexity/index.html

    - name: Write job summary
      run: python3 scripts/code-analysis-summary.py

    - name: Upload code analysis reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: code-analysis
        path: reports/

  # ── Integration Tests (MySQL via Docker Compose) ────────────────────────────
  # Set repository variable MYSQL_INTEGRATION_TESTS=true to enable this job.
  # If the variable is absent or any other value, the job is skipped.
  integration-tests-mysql:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Check if integration tests are enabled
      id: check
      run: |
        if [ "${{ vars.MYSQL_INTEGRATION_TESTS }}" = "true" ]; then
          echo "MySQL integration tests are enabled — proceeding."
          echo "enabled=true" >> $GITHUB_OUTPUT
        else
          echo "MySQL integration tests are disabled (set repository variable MYSQL_INTEGRATION_TESTS=true to enable)."
          echo "enabled=false" >> $GITHUB_OUTPUT
        fi

    - uses: actions/checkout@v4
      if: steps.check.outputs.enabled == 'true'

    - name: Run MySQL integration tests
      if: steps.check.outputs.enabled == 'true'
      # --build               rebuilds the test image so code changes are picked up
      # --exit-code-from      propagates the test container's exit code as the job result
      # --abort-on-container-exit  stops all services once the test container exits
      run: |
        docker compose -f src/docker-compose.integration.yml up \
          --build \
          --exit-code-from integration-tests \
          --abort-on-container-exit

    - name: Show integration test logs
      if: always() && steps.check.outputs.enabled == 'true'
      run: docker compose -f src/docker-compose.integration.yml logs integration-tests

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always() && steps.check.outputs.enabled == 'true'
      with:
        name: integration-test-results-mysql
        path: src/test-results/*.trx

    - name: Tear down MySQL
      if: always() && steps.check.outputs.enabled == 'true'
      run: docker compose -f src/docker-compose.integration.yml down --volumes

  # ── Publish NuGet Package ────────────────────────────────────────────────────
  publish:
    name: Publish NuGet Package
    runs-on: ubuntu-latest
    needs: [build, integration-tests-mysql]
    if: |
      github.event_name == 'push' &&
      (needs.integration-tests-mysql.result == 'success' || needs.integration-tests-mysql.result == 'skipped')
    # Hoist all vars/secrets to job level so every step can access them without
    # repeating env blocks. CSPROJ_PATH and NUGET_PACKAGE_ID are repository
    # variables (non-secret); PACKAGE_N2 is a repository secret.
    env:
      CSPROJ_PATH: ${{ vars.CSPROJ_PATH }}
      NUGET_PACKAGE_ID: ${{ vars.NUGET_PACKAGE_ID }}
      PACKAGE_N2: ${{ secrets.PACKAGE_N2 }}

    steps:
    - uses: actions/checkout@v4

    - name: Verify workflow parameters
      run: bash scripts/verify-workflow-params.sh CSPROJ_PATH NUGET_PACKAGE_ID PACKAGE_N2

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src

    - name: Build (Release)
      run: dotnet build src --no-restore --configuration Release

    - name: Check if version already exists on NuGet
      id: version_check
      run: |
        VERSION=$(grep -oP '(?<=<PackageVersion>)[^<]+' "$CSPROJ_PATH")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          https://api.nuget.org/v3-flatcontainer/$NUGET_PACKAGE_ID/$VERSION/$NUGET_PACKAGE_ID.$VERSION.nupkg)
        if [ "$STATUS" = "200" ]; then
          echo "Version $VERSION already exists on NuGet — skipping publish."
          echo "already_published=true" >> $GITHUB_OUTPUT
        else
          echo "Version $VERSION is new — will publish."
          echo "already_published=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish
      run: |
        if [ "${{ steps.version_check.outputs.already_published }}" = "true" ]; then
          echo "Version ${{ steps.version_check.outputs.version }} already exists on NuGet — nothing to publish."
          exit 0
        fi
        dotnet nuget push **/*.nupkg --api-key $PACKAGE_N2 --source https://api.nuget.org/v3/index.json
