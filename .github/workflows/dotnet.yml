# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  # ── Build and Unit Tests ───────────────────────────────────────────────────────
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: Firenza/secrets-to-env@v1.3.0
      name: Set secrets as environment variables
      with:
        secrets: ${{ toJSON(secrets) }}
        secret_filter_regex: ENV_*
    - uses: actions/checkout@v4

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src
    - name: Build
      run: dotnet build src --no-restore
    - name: Test
      run: dotnet test src --no-build --verbosity normal --filter "TestCategory!=Integration"

    - name: Upload unit test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: src/TestResults/*.trx

    - name: Publish
      run: dotnet nuget push **/*.nupkg --api-key ${{ secrets.PACKAGE_N2 }} --source https://api.nuget.org/v3/index.json

  # ── Integration Tests (MySQL via Docker Compose) ────────────────────────────
  integration-tests-mysql:
    name: Integration Tests — MySQL
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Run MySQL integration tests
      # --build               rebuilds the test image so code changes are picked up
      # --exit-code-from      propagates the test container's exit code as the job result
      # --abort-on-container-exit  stops all services once the test container exits
      run: |
        docker compose -f src/docker-compose.integration.yml up \
          --build \
          --exit-code-from integration-tests \
          --abort-on-container-exit

    - name: Show integration test logs
      if: always()
      run: docker compose -f src/docker-compose.integration.yml logs integration-tests

    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-mysql
        path: src/test-results/*.trx

    - name: Tear down MySQL
      if: always()
      run: docker compose -f src/docker-compose.integration.yml down --volumes
