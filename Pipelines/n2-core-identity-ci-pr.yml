# Pull-request pipeline — runs on every PR targeting trunk.
# Stages: Build and Test → Code Analysis
# Integration tests and NuGet publish do not run on PRs.
#
# Pipeline setting: enable "Allow scripts to access the OAuth token"
# (required for the run-retention step).

trigger: none

pr:
  branches:
    include: [trunk]

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

stages:

# ── Stage 1: Build and Unit Tests ─────────────────────────────────────────────
- stage: CI
  displayName: Build and Test
  jobs:
  - job: Build
    displayName: Build and Unit Tests
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 11.0
      inputs:
        version: 11.0.x

    - task: UseDotNet@2
      displayName: Use .NET 10.0
      inputs:
        version: 10.0.x

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: 'src/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: '--no-restore --configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests
      inputs:
        command: test
        projects: 'src/**/*.UnitTests.csproj'
        arguments: >-
          --no-build
          --configuration $(buildConfiguration)
          --filter "TestCategory!=Integration&TestCategory!=LongRunning"
        publishTestResults: true
      env:
        Logging__LogLevel__Default: Error

    - pwsh: |
        $uri = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$($env:SYSTEM_TEAMPROJECTID)/_apis/build/retention/leases?api-version=7.1"
        $body = ConvertTo-Json -Compress -InputObject @(
          @{
            ownerId         = "Pipeline:$($env:SYSTEM_DEFINITIONID)"
            definitionId    = [int]$env:SYSTEM_DEFINITIONID
            runId           = [int]$env:BUILD_BUILDID
            daysValid       = 3
            protectPipeline = $false
          }
        )
        Invoke-RestMethod -Method Post -Uri $uri `
          -Headers @{ Authorization = "Bearer $($env:SYSTEM_ACCESSTOKEN)" } `
          -ContentType 'application/json' -Body $body
      displayName: Retain PR run for 3 days
      condition: succeeded()
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

# ── Stage 2: Code Analysis ────────────────────────────────────────────────────
- stage: CodeAnalysis
  displayName: Code Analysis
  dependsOn: CI
  condition: succeeded('CI')
  jobs:
  - job: Analyse
    displayName: Coverage and Complexity
    variables:
      COVERAGE_DIR: '$(Agent.TempDirectory)'
    steps:
    - task: UseDotNet@2
      displayName: Use .NET 11.0
      inputs:
        version: 11.0.x

    - task: UseDotNet@2
      displayName: Use .NET 10.0
      inputs:
        version: 10.0.x

    - task: DotNetCoreCLI@2
      displayName: Restore packages
      inputs:
        command: restore
        projects: 'src/**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: 'src/**/*.csproj'
        arguments: '--no-restore'

    - task: DotNetCoreCLI@2
      displayName: Run unit tests with coverage
      inputs:
        command: test
        projects: 'src/**/*.UnitTests.csproj'
        arguments: >-
          --no-build
          --framework net10.0
          --verbosity normal
          --filter "TestCategory!=Integration&TestCategory!=LongRunning"
          --collect:"XPlat Code Coverage"
      env:
        Logging__LogLevel__Default: Error

    - script: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.6.0
      displayName: Install ReportGenerator

    - script: |
        reportgenerator \
          -reports:"$(COVERAGE_DIR)/**/coverage.cobertura.xml" \
          -targetdir:reports/coverage \
          -reporttypes:"HtmlInline_AzurePipelines;Cobertura" \
          -assemblyfilters:"+N2.Core.Identity" \
          -title:"N2.Core.Identity — Test Coverage"
      displayName: Generate HTML coverage report

    - task: PublishCodeCoverageResults@2
      displayName: Publish coverage to pipeline
      condition: always()
      inputs:
        summaryFileLocation: reports/coverage/Cobertura.xml
        reportDirectory: reports/coverage

    - bash: pip install lizard==1.25.0
      displayName: Install lizard

    - bash: |
        mkdir -p reports/complexity
        lizard src/N2.Core.Identity -C 10 --html > reports/complexity/index.html
      displayName: Generate complexity report

    - bash: |
        SUMMARY_FILE="$(Agent.TempDirectory)/code-analysis-summary.md"
        PIPELINE_SUMMARY_FILE="$SUMMARY_FILE" python3 scripts/az-code-analysis-summary.py \
          --source src/N2.Core.Identity \
          --coverage-dir "$(COVERAGE_DIR)"
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"
      displayName: Write pipeline summary
      condition: always()

    - task: PublishBuildArtifacts@1
      displayName: Upload analysis reports
      condition: always()
      inputs:
        PathtoPublish: reports/
        ArtifactName: code-analysis
